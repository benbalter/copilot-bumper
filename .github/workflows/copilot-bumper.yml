name: Copilot PR Bumper

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (does not comment on PRs)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      skip_non_owned_repos:
        description: 'Skip repositories not owned by you'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  bump-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bump stalled Copilot PRs
        run: node index.js
        env:
          PAT: ${{ secrets.PAT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SKIP_NON_OWNED_REPOS: ${{ github.event.inputs.skip_non_owned_repos || 'true' }}
